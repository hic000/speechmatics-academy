name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: use-cases/09-flutter-mobile-transcription/flutter

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: APK oluştur
        run: flutter build apk --release

      - name: APK'yı yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: use-cases/09-flutter-mobile-transcription/flutter/build/app/outputs/flutter-apk/app-release.apk
